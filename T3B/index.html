<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Counter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="counter-container">
        <div class="counter-card">
            <h1 class="counter-title">Counter</h1>
            <div class="count-display" id="count-display">0</div>
            <div class="button-group">
                <button class="btn btn-decrement" id="btn-decrement">-</button>
                <button class="btn btn-reset" id="btn-reset">Reset</button>
                <button class="btn btn-increment" id="btn-increment">+</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
